<script>
        // Simple micro-interaction for confetti effect
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#006036', '#9bf6ba', '#fdbf35', '#1a7a4a'];
            
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 1;
                
                confetti.animate([
                    { top: '-10%', opacity: 1, transform: `rotate(0deg)` },
                    { top: '110%', opacity: 0, transform: `rotate(${Math.random() * 720}deg) translateX(${Math.random() * 50 - 25}px)` }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                    fill: 'forwards'
                });

                container.appendChild(confetti);
                
                // Cleanup
                setTimeout(() => confetti.remove(), (duration + delay) * 1000);
            }
        }

        // Trigger confetti on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(createConfetti, 300);
        });
    </script>
