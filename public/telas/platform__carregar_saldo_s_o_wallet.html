<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-margin h-16 bg-surface shadow-sm">
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-primary p-2 hover:bg-primary-container/10 transition-colors rounded-full active:scale-95 duration-150">arrow_back</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Add Funds</h1>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary p-2 hover:bg-primary-container/10 transition-colors rounded-full active:scale-95 duration-150">notifications</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-container-margin max-w-lg mx-auto w-full">
<!-- Amount Input Section -->
<section class="mb-lg">
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-[0_4px_12px_0_rgba(0,96,54,0.06)]">
<label class="font-label-lg text-on-surface-variant mb-xs block">Enter Amount</label>
<div class="relative flex items-center">
<span class="absolute left-4 font-headline-md text-primary">STN</span>
<input class="w-full bg-surface-container-low border-none focus:ring-2 focus:ring-primary rounded-lg py-4 pl-16 pr-4 text-headline-md font-bold text-on-surface" placeholder="0.00" type="number"/>
</div>
<div class="flex flex-wrap gap-sm mt-md">
<button class="px-md py-1 bg-primary-container/10 text-primary rounded-full font-label-lg border border-primary/20 hover:bg-primary-container/20 transition-all">+ 500</button>
<button class="px-md py-1 bg-primary-container/10 text-primary rounded-full font-label-lg border border-primary/20 hover:bg-primary-container/20 transition-all">+ 1,000</button>
<button class="px-md py-1 bg-primary-container/10 text-primary rounded-full font-label-lg border border-primary/20 hover:bg-primary-container/20 transition-all">+ 2,500</button>
</div>
</div>
</section>
<!-- Payment Methods Grid -->
<section class="mb-xl">
<h2 class="font-headline-md text-on-surface mb-md">Select Payment Method</h2>
<div class="grid grid-cols-1 gap-md">
<!-- Bank Transfer -->
<div class="relative">
<input checked="" class="method-radio hidden peer" id="bank_transfer" name="payment_method" type="radio"/>
<label class="flex items-center p-md bg-surface-container-lowest border-2 border-transparent rounded-xl shadow-sm cursor-pointer hover:border-primary-fixed-dim transition-all peer-checked:border-primary peer-checked:bg-primary/5 block" for="bank_transfer">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-primary">account_balance</span>
</div>
<div class="flex-grow">
<h3 class="font-label-lg text-on-surface">Bank Transfer (Dobra)</h3>
<p class="font-label-sm text-on-surface-variant">Instant via BCA or BGFI</p>
</div>
<span class="material-symbols-outlined text-primary opacity-0 check-icon transition-opacity">check_circle</span>
</label>
</div>
<!-- Local Agent -->
<div class="relative">
<input class="method-radio hidden peer" id="local_agent" name="payment_method" type="radio"/>
<label class="flex items-center p-md bg-surface-container-lowest border-2 border-transparent rounded-xl shadow-sm cursor-pointer hover:border-primary-fixed-dim transition-all peer-checked:border-primary peer-checked:bg-primary/5 block" for="local_agent">
<div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-secondary">store</span>
</div>
<div class="flex-grow">
<h3 class="font-label-lg text-on-surface">Local Konekta Agent</h3>
<p class="font-label-sm text-on-surface-variant">Deposit cash at any registered shop</p>
</div>
<span class="material-symbols-outlined text-primary opacity-0 check-icon transition-opacity">check_circle</span>
</label>
</div>
<!-- Reference Number -->
<div class="relative">
<input class="method-radio hidden peer" id="reference" name="payment_method" type="radio"/>
<label class="flex items-center p-md bg-surface-container-lowest border-2 border-transparent rounded-xl shadow-sm cursor-pointer hover:border-primary-fixed-dim transition-all peer-checked:border-primary peer-checked:bg-primary/5 block" for="reference">
<div class="w-12 h-12 rounded-full bg-tertiary-fixed-dim/30 flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-tertiary">confirmation_number</span>
</div>
<div class="flex-grow">
<h3 class="font-label-lg text-on-surface">Payment Reference</h3>
<p class="font-label-sm text-on-surface-variant">Pay via ATM or PagAqui</p>
</div>
<span class="material-symbols-outlined text-primary opacity-0 check-icon transition-opacity">check_circle</span>
</label>
</div>
</div>
</section>
<!-- Trust Information -->
<section class="bg-primary/5 rounded-xl p-md flex gap-md items-start mb-2xl">
<span class="material-symbols-outlined text-primary shrink-0">verified_user</span>
<div>
<p class="font-label-lg text-primary">Secure Transaction</p>
<p class="font-label-sm text-on-surface-variant">Your funds are protected by the Central Bank of São Tomé and Príncipe regulations. Deposits are usually credited within 10 minutes.</p>
</div>
</section>

<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent flex items-end p-lg">
<span class="text-white font-headline-md drop-shadow-md">São Wallet: Locally Trusted</span>
</div>
</div>
</main>
<!-- Bottom Actions Layer -->
<div class="fixed bottom-0 left-0 w-full bg-surface px-container-margin pt-4 pb-8 shadow-[0_-8px_20px_0_rgba(0,0,0,0.05)] z-40">
<div class="max-w-lg mx-auto">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md active:scale-95 transition-transform duration-200 flex items-center justify-center gap-sm">
                Confirm Deposit
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center font-label-sm text-on-surface-variant mt-md">By confirming, you agree to our Terms of Service</p>
</div>
</div>
<!-- BottomNavBar (Filtered based on Transactional State - Suppressed but included structure for consistency if navigation is needed) -->
<!-- Hidden for this focused task per instructions 'suppress navigation for task-focused screens' -->
<script>
        // Micro-interactions for button active states
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => btn.classList.add('scale-95'));
            btn.addEventListener('touchend', () => btn.classList.remove('scale-95'));
        });

        // Simple amount presets logic
        const amountInput = document.querySelector('input[type="number"]');
        document.querySelectorAll('button.px-md').forEach(preset => {
            preset.addEventListener('click', () => {
                const val = parseInt(preset.innerText.replace('+ ', '').replace(',', ''));
                const current = parseFloat(amountInput.value) || 0;
                amountInput.value = (current + val).toFixed(2);
                
                // Visual feedback
                preset.classList.add('bg-primary', 'text-white');
                setTimeout(() => {
                    preset.classList.remove('bg-primary', 'text-white');
                }, 200);
            });
        });
    </script>
