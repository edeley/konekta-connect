<main class="pt-24 pb-12 min-h-screen">

<script>
        const scrollContainer = document.getElementById('scrollContainer');
        const progressBar = document.getElementById('progressBar');
        const stepCounter = document.getElementById('stepCounter');
        const stepTitle = document.getElementById('stepTitle');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');

        function nextStep() {
            scrollContainer.scrollTo({
                left: window.innerWidth,
                behavior: 'smooth'
            });
            updateProgress(2);
        }

        function prevStep() {
            scrollContainer.scrollTo({
                left: 0,
                behavior: 'smooth'
            });
            updateProgress(1);
        }

        function updateProgress(step) {
            if (step === 2) {
                progressBar.style.width = '100%';
                stepCounter.innerText = 'Passo 2 de 2';
                stepTitle.innerText = 'Perfil de Uso';
                step2.classList.remove('opacity-0', 'pointer-events-none');
                step1.classList.add('opacity-0', 'pointer-events-none');
            } else {
                progressBar.style.width = '50%';
                stepCounter.innerText = 'Passo 1 de 2';
                stepTitle.innerText = 'Os teus dados';
                step1.classList.remove('opacity-0', 'pointer-events-none');
                step2.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // Password Strength Logic
        const passwordInput = document.getElementById('passwordInput');
        const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
        const strengthText = document.getElementById('strengthText');

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let strength = 0;
            if (val.length > 5) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            bars.forEach((bar, index) => {
                bar.className = 'h-1 flex-1 rounded-full bg-grey200 transition-colors duration-300';
                if (index < strength) {
                    if (strength === 1) { bar.classList.replace('bg-grey200', 'bg-error'); strengthText.innerText = 'Fraca'; strengthText.className = 'font-caption text-caption font-medium text-error'; }
                    else if (strength === 2) { bar.classList.replace('bg-grey200', 'bg-warning'); strengthText.innerText = 'Média'; strengthText.className = 'font-caption text-caption font-medium text-warning'; }
                    else if (strength >= 3) { bar.classList.replace('bg-grey200', 'bg-primary'); strengthText.innerText = 'Forte'; strengthText.className = 'font-caption text-caption font-medium text-primary'; }
                }
            });
            if (val === '') {
                strengthText.innerText = 'Fraca';
                strengthText.className = 'font-caption text-caption font-medium text-error';
            }
        });

        // Radio Selection UI helper
        document.querySelectorAll('input[name="profile"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('input[name="profile"]').forEach(r => {
                   r.nextElementSibling.querySelector('div:last-child > div').classList.add('opacity-0');
                   r.nextElementSibling.classList.replace('border-primary', 'border-grey200');
                   r.nextElementSibling.classList.replace('bg-primary-fixed-dim/10', 'bg-white');
                });
                if (e.target.checked) {
                   e.target.nextElementSibling.querySelector('div:last-child > div').classList.remove('opacity-0');
                }
            });
        });

        // Handle Form Submission
        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulating success
            alert('Conta criada com sucesso na KONEKTA STP!');
        });
    </script>
