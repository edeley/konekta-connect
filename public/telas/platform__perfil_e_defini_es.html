<script>
        // Micro-interaction: Ripple effect simulation on buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', function (e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                let ripple = document.createElement('span');
                ripple.style.position = 'absolute';
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.style.width = '2px';
                ripple.style.height = '2px';
                ripple.style.background = 'rgba(0, 96, 54, 0.1)';
                ripple.style.borderRadius = '50%';
                ripple.style.transform = 'scale(0)';
                ripple.style.transition = 'transform 0.5s ease-out, opacity 0.5s';
                ripple.style.pointerEvents = 'none';
                
                this.style.position = 'relative';
                this.style.overflow = 'hidden';
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.style.transform = 'scale(100)';
                    ripple.style.opacity = '0';
                }, 0);
                
                setTimeout(() => {
                    ripple.remove();
                }, 500);
            });
        });

        // Toggle Switch functionality (Simple visual update)
        const toggleInput = document.querySelector('input[type="checkbox"]');
        toggleInput.addEventListener('change', function() {
            if(this.checked) {
                console.log("Switching to Provider Mode...");
            } else {
                console.log("Switching to Consumer Mode...");
            }
        });
    </script>
