<style>
        body {
            background-color: #fcf8ff;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .segmented-control-active {
            background-color: #006036;
            color: white;
            box-shadow: 0 2px 4px rgba(0, 96, 54, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #006036;
            border-radius: 10px;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface antialiased">
<!-- Top Navigation Bar -->
<header class="bg-surface sticky top-0 z-50 flex items-center px-screen-margin h-16 w-full max-w-full">
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-grey100 active:opacity-80 transition-all">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="ml-2 font-headline-sm text-headline-sm text-primary font-bold">Registo de Perfil</h1>
</header>
<main class="max-w-md mx-auto px-screen-margin pt-lg pb-xxl">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center mb-xl">
<div class="relative group">
<div class="w-28 h-28 rounded-full bg-grey100 border-2 border-dashed border-primary flex items-center justify-center overflow-hidden transition-all group-hover:bg-grey200">
<span class="material-symbols-outlined text-4xl text-grey400">person</span>
<!-- Hidden input for photo -->
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" id="photo-upload" type="file"/>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-white w-9 h-9 rounded-full flex items-center justify-center border-4 border-background shadow-sm">
<span class="material-symbols-outlined text-[20px]">add_a_photo</span>
</div>
</div>
<p class="mt-sm font-label text-label text-grey600">Adicionar Foto de Perfil</p>
</section>
<form class="space-y-lg" id="registration-form">
<!-- Personal Info Section -->
<div class="space-y-md">
<h2 class="font-title-sm text-title-sm text-on-surface border-l-4 border-primary pl-3">Dados Pessoais</h2>
<div class="space-y-sm">
<label class="block font-label text-label text-grey600" for="full-name">Nome Completo</label>
<input class="w-full h-12 px-md bg-white border border-grey200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-shadow outline-none text-body-sm" id="full-name" placeholder="Ex: João Manuel dos Santos" type="text"/>
</div>
<div class="grid grid-cols-1 gap-md">
<div class="space-y-sm">
<label class="block font-label text-label text-grey600" for="contact">Contacto</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 font-body-sm text-grey600 border-r border-grey200 pr-3">+239</span>
<input class="w-full h-12 pl-20 pr-md bg-white border border-grey200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none text-body-sm" id="contact" placeholder="9xx xxx xxx" type="tel"/>
</div>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label text-label text-grey600 flex justify-between" for="email">
                        E-mail <span class="font-caption text-grey400">(Opcional)</span>
</label>
<input class="w-full h-12 px-md bg-white border border-grey200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none text-body-sm" id="email" placeholder="email@exemplo.st" type="email"/>
</div>
</div>
<!-- Gender Selection Section -->
<div class="space-y-md">
<h2 class="font-title-sm text-title-sm text-on-surface border-l-4 border-primary pl-3">Género</h2>
<div class="flex bg-grey100 p-1 rounded-xl">
<button class="gender-btn flex-1 py-2.5 rounded-lg font-label text-label text-grey600 transition-all duration-200" onclick="selectGender(this, 'Masculino')" type="button">
                        Masculino
                    </button>
<button class="gender-btn flex-1 py-2.5 rounded-lg font-label text-label text-grey600 transition-all duration-200" onclick="selectGender(this, 'Feminino')" type="button">
                        Feminino
                    </button>
</div>
<input id="gender-value" name="gender" type="hidden"/>
</div>
<!-- Location Details Section -->
<div class="space-y-md">
<h2 class="font-title-sm text-title-sm text-on-surface border-l-4 border-primary pl-3">Localização</h2>
<div class="space-y-md">
<div class="space-y-sm">
<label class="block font-label text-label text-grey600">Região</label>
<div class="relative">
<select class="w-full h-12 px-md bg-white border border-grey200 rounded-xl appearance-none focus:ring-2 focus:ring-primary focus:border-primary outline-none text-body-sm">
<option disabled="" selected="" value="">Selecionar Região</option>
<option value="sao-tome">Ilha de São Tomé</option>
<option value="principe">Ilha do Príncipe</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-grey400">expand_more</span>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="space-y-sm">
<label class="block font-label text-label text-grey600">Distrito</label>
<div class="relative">
<select class="w-full h-12 px-md bg-white border border-grey200 rounded-xl appearance-none focus:ring-2 focus:ring-primary focus:border-primary outline-none text-body-sm">
<option disabled="" selected="" value="">Distrito</option>
<option>Água Grande</option>
<option>Mé-Zóchi</option>
<option>Cantagalo</option>
<option>Caué</option>
<option>Lemba</option>
<option>Lobata</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-grey400">expand_more</span>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label text-label text-grey600">Zona / Localidade</label>
<input class="w-full h-12 px-md bg-white border border-grey200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none text-body-sm" placeholder="Ex: Almas" type="text"/>
</div>
</div>
</div>
</div>
<!-- Visual Separator with tropical flavor -->
<div class="pt-lg">
<div class="h-px w-full bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
</div>
<!-- Submit Button Section -->
<div class="pt-md pb-lg">
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-white font-button text-button h-14 rounded-xl shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
                    Finalizar Registo
                    <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<p class="text-center mt-lg font-caption text-caption text-grey400">
                    Ao continuar, você concorda com os <a class="text-primary font-medium underline underline-offset-4" href="#">Termos e Condições</a> da Konekta STP.
                </p>
</div>
</form>
</main>
<!-- Bottom Spacing for safe area -->
<div class="h-8"></div>
<script>
        function selectGender(element, value) {
            // Remove active classes from all siblings
            const buttons = document.querySelectorAll('.gender-btn');
            buttons.forEach(btn => {
                btn.classList.remove('segmented-control-active');
                btn.classList.add('text-grey600');
            });
            
            // Add active class to clicked
            element.classList.add('segmented-control-active');
            element.classList.remove('text-grey600');
            
            // Set hidden value
            document.getElementById('gender-value').value = value;
            
            // Subtle haptic feel simulation
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }

        // Form Submission Interception
        document.getElementById('registration-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Loading state simulation
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Processando...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Sucesso!';
                btn.classList.replace('bg-primary', 'bg-secondary');
                
                // Success logic here
                console.log('Registration submitted');
            }, 1800);
        });

        // Photo Preview Simulation
        document.getElementById('photo-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const avatarDiv = e.target.parentElement;
                    avatarDiv.style.backgroundImage = `url(${event.target.result})`;
                    avatarDiv.style.backgroundSize = 'cover';
                    avatarDiv.style.backgroundPosition = 'center';
                    avatarDiv.classList.remove('border-dashed');
                    avatarDiv.innerHTML = ''; // Clear icon
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body></html>
