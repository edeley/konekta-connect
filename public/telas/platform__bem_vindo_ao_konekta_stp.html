<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-transparent rounded-xl focus:ring-2 focus:ring-primary focus:bg-white transition-all text-body-md outline-none" id="identity" name="identity" placeholder="ex: manuel@konekta.st" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-lg text-on-surface-variant px-1" for="password">Palavra-passe</label>

<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passToggleIcon">visibility</span>

</div>
</div>

<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passToggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Micro-interaction for form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Carregando...`;
            
            setTimeout(() => {
                // Mock success
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Sucesso!`;
                btn.classList.replace('bg-primary', 'bg-primary-container');
                setTimeout(() => {
                    alert('Navegando para o Dashboard...');
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.replace('bg-primary-container', 'bg-primary');
                }, 1000);
            }, 2000);
        });

        // Atmospheric parallax effect
        document.addEventListener('mousemove', (e) => {
            const bg = document.querySelector('.fixed.inset-0.z-0');
            const x = (e.clientX - window.innerWidth / 2) / 100;
            const y = (e.clientY - window.innerHeight / 2) / 100;
            bg.style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
        });
    </script>
