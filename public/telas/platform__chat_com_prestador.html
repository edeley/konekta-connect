<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->

</button>
<div class="flex items-center gap-sm">
<div class="relative">
<img class="w-10 h-10 rounded-full object-cover border-2 border-primary-fixed" data-alt="A professional close-up portrait of Maria, a friendly Santomean service provider in her late 30s. She has a warm, confident smile and braided hair. The background is a soft-focus tropical garden in São Tomé, with vibrant greenery and soft sunlight. The photo has high-end corporate marketplace quality, clean and trustworthy." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmBVqnodJ3cj06Z4LW59mmyZ-a35V_vwNb98sjaYAN6nP3EUp_59WZo2pVBh-rYmdLWvoqxpEV36XlPs69xYhEbIFW9mwti_u6Lum0K4tKHtgRKyJcnTtxU4HMiqsnka_Cn7GK5Zz7ADrS1VD-7qTZUhRcO2npH5LJs23GHn3I0BRwVIl-g_YOSydLGw9c123hpc9EQic0Ui23xfUmoN9RFd5V0oYWrDUTHSE-nyXM54L2iqn5dJSr7UwnKJh38TiOnwo0Potw-Y8"/>
<div class="absolute bottom-0 right-0 w-3 h-3 bg-primary border-2 border-surface rounded-full"></div>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Maria</span>
<span class="font-label-sm text-[10px] text-primary flex items-center gap-1">
<span class="w-1 h-1 bg-primary rounded-full animate-pulse"></span>
                        Online
                    </span>
</div>
</div>
</div>
<div class="flex items-center gap-sm">
<button class="p-sm hover:bg-primary-container/10 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">call</span>
</button>
<button class="p-sm hover:bg-primary-container/10 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">more_vert</span>
</button>
</div>
</header>
<!-- Chat Canvas -->
<main class="flex-1 pt-20 pb-44 px-container-margin overflow-y-auto flex flex-col gap-md hide-scrollbar" id="chat-window">
<!-- Date Divider -->
<div class="flex justify-center my-md">
<span class="px-md py-xs bg-surface-variant/40 rounded-full text-label-sm font-label-sm text-on-surface-variant">Hoje</span>
</div>
<!-- Message Provider -->
<div class="flex flex-col items-start gap-1 max-w-[85%]">
<div class="message-bubble-provider bg-white p-md shadow-sm border border-surface-variant/10 text-on-surface">
                Olá! Já terminei o serviço anterior e estou a caminho da sua morada.
            </div>
<span class="text-[10px] text-outline ml-1">09:42</span>
</div>
<!-- Message Client -->
<div class="flex flex-col items-end gap-1 self-end max-w-[85%]">
<div class="message-bubble-client bg-primary text-on-primary p-md shadow-sm">
                Perfeito, Maria. Consegue chegar em 15 minutos?
            </div>
<div class="flex items-center gap-1 mr-1">
<span class="text-[10px] text-outline">09:45</span>
<span class="material-symbols-outlined text-[12px] text-primary" style="font-variation-settings: 'FILL' 1;">done_all</span>
</div>
</div>
<!-- Message Provider -->
<div class="flex flex-col items-start gap-1 max-w-[85%]">
<div class="message-bubble-provider bg-white p-md shadow-sm border border-surface-variant/10 text-on-surface">
                Sim, o trânsito está leve-leve hoje. Chego num instante! 🌴
            </div>
<span class="text-[10px] text-outline ml-1">09:46</span>
</div>
<!-- Message Client with Image Placeholder style -->
<div class="flex flex-col items-end gap-1 self-end max-w-[85%]">
<div class="message-bubble-client bg-primary text-on-primary p-md shadow-sm">
                Vou deixar o portão aberto para facilitar.
            </div>
<div class="flex items-center gap-1 mr-1">
<span class="text-[10px] text-outline">09:47</span>
<span class="material-symbols-outlined text-[12px] text-primary" style="font-variation-settings: 'FILL' 1;">done_all</span>
</div>
</div>
</main>
<!-- Interactive Bottom Bar & Tools -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-surface border-t border-surface-variant/30 pb-safe">
<!-- Quick Replies Row -->
<div class="flex gap-sm px-container-margin py-sm overflow-x-auto hide-scrollbar">
<button class="whitespace-nowrap px-md py-2 bg-primary-fixed text-on-primary-fixed-variant font-label-sm text-label-sm rounded-full border border-primary-fixed-dim/30 hover:bg-primary-fixed-dim transition-colors active:scale-95" onclick="sendQuickReply('Estou a chegar')">
                Estou a chegar
            </button>
<button class="whitespace-nowrap px-md py-2 bg-primary-fixed text-on-primary-fixed-variant font-label-sm text-label-sm rounded-full border border-primary-fixed-dim/30 hover:bg-primary-fixed-dim transition-colors active:scale-95" onclick="sendQuickReply('Pode subir')">
                Pode subir
            </button>
<button class="whitespace-nowrap px-md py-2 bg-primary-fixed text-on-primary-fixed-variant font-label-sm text-label-sm rounded-full border border-primary-fixed-dim/30 hover:bg-primary-fixed-dim transition-colors active:scale-95" onclick="sendQuickReply('Obrigado')">
                Obrigado
            </button>
<button class="whitespace-nowrap px-md py-2 bg-primary-fixed text-on-primary-fixed-variant font-label-sm text-label-sm rounded-full border border-primary-fixed-dim/30 hover:bg-primary-fixed-dim transition-colors active:scale-95" onclick="sendQuickReply('Estou à porta')">
                Estou à porta
            </button>
</div>
<!-- Main Input Area -->
<div class="flex items-center gap-sm px-container-margin py-md pb-8">
<button class="p-sm text-outline hover:text-primary transition-colors active:scale-90">
<span class="material-symbols-outlined">add_circle</span>
</button>
<button class="p-sm text-outline hover:text-primary transition-colors active:scale-90">
<span class="material-symbols-outlined">image</span>
</button>
<div class="flex-1 relative">
<input class="w-full bg-surface-container border-none rounded-full py-3 px-md pr-12 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder-on-surface-variant/60 font-body-md text-body-md outline-none transition-shadow" id="chat-input" placeholder="Escreva uma mensagem..." type="text"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 p-sm text-primary hover:bg-primary-container/10 rounded-full transition-all active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<button class="w-12 h-12 flex items-center justify-center bg-primary text-on-primary rounded-full shadow-lg shadow-primary/20 hover:scale-105 active:scale-90 transition-all" id="send-btn">
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
<script>
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatWindow = document.getElementById('chat-window');

        function appendMessage(text, isClient = true) {
            const container = document.createElement('div');
            container.className = isClient 
                ? 'flex flex-col items-end gap-1 self-end max-w-[85%] animate-in fade-in slide-in-from-bottom-2 duration-300' 
                : 'flex flex-col items-start gap-1 max-w-[85%] animate-in fade-in slide-in-from-bottom-2 duration-300';
            
            const now = new Date();
            const time = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            container.innerHTML = `
                <div class="${isClient ? 'message-bubble-client bg-primary text-on-primary' : 'message-bubble-provider bg-white text-on-surface border border-surface-variant/10'} p-md shadow-sm">
                    ${text}
                </div>
                <div class="flex items-center gap-1 ${isClient ? 'mr-1' : 'ml-1'}">
                    <span class="text-[10px] text-outline">${time}</span>
                    ${isClient ? '<span class="material-symbols-outlined text-[12px] text-primary">done</span>' : ''}
                </div>
            `;
            
            chatWindow.appendChild(container);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleSend() {
            const val = chatInput.value.trim();
            if (val) {
                appendMessage(val);
                chatInput.value = '';
                
                // Simulate reply
                setTimeout(() => {
                    if(val.toLowerCase().includes('obrigado')) {
                        appendMessage('De nada! Até já.', false);
                    }
                }, 1500);
            }
        }

        function sendQuickReply(text) {
            appendMessage(text);
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Auto-scroll to bottom on load
        window.onload = () => {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        };
    </script>
</body></html>
