<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #fcf8ff;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E8E8EE;
            border-radius: 10px;
        }
        .ai-pulse {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .card-enter {
            animation: slide-up 0.4s ease-out forwards;
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="font-body-lg text-on-background">
<!-- Top Navigation Bar (Shared Component: TopAppBar) -->
<header class="bg-primary shadow-sm docked full-width top-0 fixed w-full z-50 flex items-center px-screen-margin h-16 pt-safe">
<button aria-label="Voltar" class="transition-all active:scale-95 text-on-primary mr-4">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-primary">KONEKTA STP</h1>
</header>
<main class="pt-20 pb-24 px-screen-margin max-w-md mx-auto min-h-screen">
<!-- IA Assistant Section -->
<section class="mb-lg mt-4">
<div class="bg-primary-container rounded-xl p-md flex items-start gap-4 shadow-sm relative overflow-hidden">
<div class="absolute -right-8 -top-8 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
<div class="flex-shrink-0 w-12 h-12 bg-on-primary-container rounded-full flex items-center justify-center ai-pulse">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div class="flex-grow">
<h2 class="font-headline-sm text-headline-sm text-on-primary-container mb-1">Ajuda Inteligente</h2>
<p class="font-body-sm text-on-primary-container opacity-90 leading-tight">
                        Olá! Estou aqui para ajudar a detalhar o seu problema. Selecione uma opção abaixo ou descreva o que aconteceu.
                    </p>
</div>
</div>
</section>
<!-- Search Bar Section -->
<section class="mb-lg">
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-grey600">
<span class="material-symbols-outlined">search</span>
</div>
<input class="w-full h-12 pl-12 pr-4 bg-white border border-grey200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm font-body-sm" id="problemSearch" placeholder="Pesquisar problemas comuns..." type="text"/>
</div>
</section>
<!-- Category & Suggestions Section -->
<section class="mb-lg">
<div class="flex items-center justify-between mb-md">
<h3 class="font-title-sm text-title-sm text-on-surface">Sugestões: <span class="text-primary font-semibold">Canalização</span></h3>
<span class="text-caption text-grey600 flex items-center gap-1">
<span class="material-symbols-outlined text-sm">filter_list</span>
                    Filtrar
                </span>
</div>
<div class="grid grid-cols-1 gap-sm">
<!-- Suggestion Card 1 -->
<button class="suggestion-card flex items-center p-md bg-white rounded-xl border border-grey100 shadow-sm hover:border-primary-container transition-all active:scale-[0.98] card-enter" onclick="fillProblem('Torneira a pingar continuamente na cozinha')" style="animation-delay: 0.1s;">
<div class="w-10 h-10 bg-surface-container-low rounded-lg flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-primary">water_drop</span>
</div>
<div class="text-left">
<p class="font-title-sm text-on-surface leading-snug">Torneira a pingar</p>
<p class="text-caption text-grey600">Cozinha ou casa de banho</p>
</div>
</button>
<!-- Suggestion Card 2 -->
<button class="suggestion-card flex items-center p-md bg-white rounded-xl border border-grey100 shadow-sm hover:border-primary-container transition-all active:scale-[0.98] card-enter" onclick="fillProblem('Fuga de água visível num cano debaixo do lava-loiça')" style="animation-delay: 0.2s;">
<div class="w-10 h-10 bg-surface-container-low rounded-lg flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-primary">plumbing</span>
</div>
<div class="text-left">
<p class="font-title-sm text-on-surface leading-snug">Fuga no cano</p>
<p class="text-caption text-grey600">Humidade ou jacto de água</p>
</div>
</button>
<!-- Suggestion Card 3 -->
<button class="suggestion-card flex items-center p-md bg-white rounded-xl border border-grey100 shadow-sm hover:border-primary-container transition-all active:scale-[0.98] card-enter" onclick="fillProblem('Esgoto do chuveiro entupido com escoamento lento')" style="animation-delay: 0.3s;">
<div class="w-10 h-10 bg-surface-container-low rounded-lg flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-primary">mop</span>
</div>
<div class="text-left">
<p class="font-title-sm text-on-surface leading-snug">Esgoto entupido</p>
<p class="text-caption text-grey600">Escoamento muito lento</p>
</div>
</button>
<!-- Suggestion Card 4 -->
<button class="suggestion-card flex items-center p-md bg-white rounded-xl border border-grey100 shadow-sm hover:border-primary-container transition-all active:scale-[0.98] card-enter" onclick="fillProblem('Cisterna da sanita não pára de correr ou encher')" style="animation-delay: 0.4s;">
<div class="w-10 h-10 bg-surface-container-low rounded-lg flex items-center justify-center mr-md">
<span class="material-symbols-outlined text-primary">tablet</span>
</div>
<div class="text-left">
<p class="font-title-sm text-on-surface leading-snug">Problema na cisterna</p>
<p class="text-caption text-grey600">A água corre sem parar</p>
</div>
</button>
</div>
</section>
<!-- Detailed Description Field -->
<section class="mb-xxl">
<label class="block font-label text-label text-grey600 mb-2" for="problemDescription">Descrição detalhada</label>
<div class="bg-white rounded-xl border border-grey200 shadow-sm p-4 focus-within:ring-2 focus-within:ring-primary focus-within:border-transparent transition-all">
<textarea class="w-full border-none focus:ring-0 p-0 text-on-surface font-body-sm resize-none custom-scrollbar" id="problemDescription" placeholder="Descreva o problema com as suas próprias palavras..." rows="4"></textarea>
<div class="mt-4 flex items-center justify-between">
<button class="flex items-center gap-1 text-primary font-button text-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined text-lg">mic</span>
                        Gravar áudio
                    </button>
<button class="flex items-center gap-1 text-primary font-button text-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined text-lg">photo_camera</span>
                        Anexar foto
                    </button>
</div>
</div>
</section>
<!-- CTA Action -->
<div class="fixed bottom-20 left-0 w-full px-screen-margin pointer-events-none">
<button class="w-full max-w-md mx-auto pointer-events-auto h-14 bg-primary text-on-primary font-button text-button rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                Prosseguir
                <span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</main>
<!-- Bottom Navigation Bar (Shared Component: BottomNavBar) -->
<nav class="bg-surface fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe rounded-t-xl shadow-md">
<button class="flex flex-col items-center justify-center text-on-surface-variant transition-transform active:scale-90 hover:bg-surface-variant p-2 rounded-xl">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
<span class="font-label text-label">Help</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl p-2 transition-transform active:scale-90 shadow-sm">
<span class="material-symbols-outlined" data-icon="support_agent" style="font-variation-settings: 'FILL' 1;">support_agent</span>
<span class="font-label text-label">Support</span>
</button>
</nav>
<script>
        function fillProblem(text) {
            const textarea = document.getElementById('problemDescription');
            textarea.value = text;
            
            // Subtle feedback effect
            textarea.parentElement.classList.add('ring-2', 'ring-primary/20');
            setTimeout(() => {
                textarea.parentElement.classList.remove('ring-2', 'ring-primary/20');
            }, 500);
            
            // Scroll to textarea smoothly
            textarea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            textarea.focus();
        }

        // Simple search filtering
        document.getElementById('problemSearch').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.suggestion-card');
            
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if(text.includes(searchTerm)) {
                    card.classList.remove('hidden');
                    card.classList.add('flex');
                } else {
                    card.classList.add('hidden');
                    card.classList.remove('flex');
                }
            });
        });

        // Initialize micro-animations
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.suggestion-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                setTimeout(() => {
                    card.style.opacity = '1';
                }, index * 100);
            });
        });
    </script>
</body></html>
