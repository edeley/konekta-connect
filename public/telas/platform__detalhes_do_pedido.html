<script>
        // Simple Interaction for selection
        const cards = document.querySelectorAll('#service-types label');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Animation effect on tap
                card.style.transform = 'scale(0.98)';
                setTimeout(() => card.style.transform = 'scale(1)', 100);
            });
        });

        // Floating label behavior placeholder
        const textarea = document.getElementById('reference');
        textarea.addEventListener('focus', () => {
            textarea.parentElement.querySelector('label').classList.add('text-primary');
        });
        textarea.addEventListener('blur', () => {
            textarea.parentElement.querySelector('label').classList.remove('text-primary');
        });
    </script>
