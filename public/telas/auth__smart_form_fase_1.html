<script>
        // Micro-interactions for Radio Selection
        const radios = document.querySelectorAll('input[type="radio"]');
        const nextBtn = document.getElementById('next-btn');

        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                // Update UI state for all cards
                document.querySelectorAll('.option-card-ui').forEach(ui => {
                    const dot = ui.querySelector('.bg-primary');
                    dot.classList.add('scale-0');
                    dot.classList.remove('scale-100');
                });

                // Update selected card UI
                if (radio.checked) {
                    const activeUI = radio.nextElementSibling;
                    const dot = activeUI.querySelector('.bg-primary');
                    dot.classList.remove('scale-0');
                    dot.classList.add('scale-100');
                    
                    // Add a small bounce effect
                    activeUI.classList.add('scale-[1.02]');
                    setTimeout(() => activeUI.classList.remove('scale-[1.02]'), 200);
                }
            });
        });

        // Simple Next Step transition
        nextBtn.addEventListener('click', (e) => {
            const selected = document.querySelector('input[name="service_type"]:checked');
            if (!selected) {
                // Shake feedback if nothing is selected
                nextBtn.classList.add('animate-shake');
                setTimeout(() => nextBtn.classList.remove('animate-shake'), 400);
                return;
            }
            
            // Logic for proceeding
            console.log('Proceeding with:', selected.value);
            // Visual feedback
            nextBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                window.alert('Serviço selecionado: ' + selected.value + '. Avançando para o próximo passo...');
                nextBtn.innerHTML = 'Próximo';
            }, 800);
        });

        // Tailwind shake animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
            .animate-shake {
                animation: shake 0.2s ease-in-out 0s 2;
                background-color: #ba1a1a !important;
            }
        `;
        document.head.appendChild(style);
    </script>
