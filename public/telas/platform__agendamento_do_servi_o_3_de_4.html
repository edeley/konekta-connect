  </head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-32">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-margin h-16 bg-surface shadow-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">location_on</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">KONEKTA STP</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-container-margin max-w-2xl mx-auto">
<!-- Step Progress Indicator -->
<section class="mb-lg">
<div class="flex items-center justify-between mb-sm">
<span class="font-label-lg text-primary">Passo 3 de 4</span>
<span class="font-label-lg text-outline">Agendamento</span>
</div>
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-3/4 rounded-full transition-all duration-500 ease-out"></div>
</div>
</section>
<!-- Header Section -->
<section class="mb-lg text-center">
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Quando deve ser feito?</h1>
<p class="font-body-md text-on-surface-variant">Escolha a melhor data e hora para receber o seu profissional de confiança.</p>
</section>
<!-- Bento Layout for Calendar and Slots -->
<div class="grid grid-cols-1 gap-gutter">
<!-- Calendar Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-sm border border-surface-variant/20">
<div class="flex items-center justify-between mb-lg">
<button class="p-2 hover:bg-surface-container rounded-full">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h3 class="font-headline-md text-headline-md-mobile text-on-surface">Outubro 2023</h3>
<button class="p-2 hover:bg-surface-container rounded-full">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Calendar Grid -->
<div class="grid grid-cols-7 gap-y-4 text-center">
<!-- Weekdays -->
<div class="font-label-sm text-outline">DOM</div>
<div class="font-label-sm text-outline">SEG</div>
<div class="font-label-sm text-outline">TER</div>
<div class="font-label-sm text-outline">QUA</div>
<div class="font-label-sm text-outline">QUI</div>
<div class="font-label-sm text-outline">SEX</div>
<div class="font-label-sm text-outline">SÁB</div>
<!-- Example Days -->
<div class="p-2 text-on-surface-variant/30 font-body-md">25</div>
<div class="p-2 text-on-surface-variant/30 font-body-md">26</div>
<div class="p-2 text-on-surface-variant/30 font-body-md">27</div>
<div class="p-2 text-on-surface-variant/30 font-body-md">28</div>
<div class="p-2 text-on-surface-variant/30 font-body-md">29</div>
<div class="p-2 text-on-surface-variant/30 font-body-md">30</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">1</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">2</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">3</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">4</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">5</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">6</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">7</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">8</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">9</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">10</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">11</div>
<div class="p-2 calendar-day-active font-body-md cursor-pointer shadow-md">12</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">13</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">14</div>
<div class="p-2 font-body-md cursor-pointer hover:bg-primary-container/10 rounded-full transition-colors">15</div>
</div>
</div>
<!-- Time Slots Card -->
<div class="space-y-lg">
<!-- Morning Slots -->
<div>
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-secondary">light_mode</span>
<h4 class="font-label-lg text-on-surface">Manhã</h4>
</div>
<div class="grid grid-cols-3 gap-sm">
<button class="slot-btn py-3 px-2 border border-outline-variant rounded-xl text-center font-body-md transition-all active:scale-95" onclick="selectSlot(this)">08:00</button>
<button class="slot-btn py-3 px-2 border border-outline-variant rounded-xl text-center font-body-md transition-all active:scale-95 active-slot" onclick="selectSlot(this)">09:30</button>
<button class="slot-btn py-3 px-2 border border-outline-variant rounded-xl text-center font-body-md transition-all active:scale-95" onclick="selectSlot(this)">11:00</button>
</div>
</div>
<!-- Afternoon Slots -->
<div>
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-primary">sunny</span>
<h4 class="font-label-lg text-on-surface">Tarde</h4>
</div>
<div class="grid grid-cols-3 gap-sm">
<button class="slot-btn py-3 px-2 border border-outline-variant rounded-xl text-center font-body-md transition-all active:scale-95" onclick="selectSlot(this)">14:00</button>
<button class="slot-btn py-3 px-2 border border-outline-variant rounded-xl text-center font-body-md transition-all active:scale-95" onclick="selectSlot(this)">15:30</button>
<button class="slot-btn py-3 px-2 border border-outline-variant rounded-xl text-center font-body-md transition-all active:scale-95" onclick="selectSlot(this)">17:00</button>
</div>
</div>
<!-- Evening Slots -->
<div>
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-tertiary">dark_mode</span>
<h4 class="font-label-lg text-on-surface">Noite</h4>
</div>
<div class="grid grid-cols-3 gap-sm">
<button class="slot-btn py-3 px-2 border border-outline-variant rounded-xl text-center font-body-md transition-all active:scale-95" onclick="selectSlot(this)">19:00</button>
<button class="slot-btn py-3 px-2 border border-outline-variant rounded-xl text-center font-body-md transition-all active:scale-95" onclick="selectSlot(this)">20:30</button>
<button class="py-3 px-2 border border-surface-variant bg-surface-variant/10 text-on-surface-variant/40 rounded-xl text-center font-body-md cursor-not-allowed">Indisponível</button>
</div>
</div>
</div>
</div>
</main>
<!-- Floating Action Footer -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface px-container-margin py-md border-t border-surface-variant/30 shadow-[0_-4px_12px_0_rgba(0,96,54,0.08)]">
<div class="max-w-2xl mx-auto flex items-center gap-md">
<button class="flex-1 h-12 flex items-center justify-center gap-2 border border-primary text-primary font-label-lg rounded-xl transition-all active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
                Retroceder
            </button>
<button class="flex-[2] h-12 flex items-center justify-center gap-2 bg-primary text-on-primary font-label-lg rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-95">
                Próximo Passo
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<!-- Micro-interaction script -->
<script>
        function selectSlot(element) {
            // Remove active class from all buttons
            document.querySelectorAll('.slot-btn').forEach(btn => {
                btn.classList.remove('active-slot');
            });
            // Add active class to clicked button
            element.classList.add('active-slot');
            
            // Haptic feedback feel
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }

        // Calendar Day selection logic
        document.querySelectorAll('.grid-cols-7 .cursor-pointer').forEach(day => {
            day.addEventListener('click', function() {
                document.querySelectorAll('.grid-cols-7 .calendar-day-active').forEach(active => {
                    active.classList.remove('calendar-day-active', 'shadow-md');
                });
                this.classList.add('calendar-day-active', 'shadow-md');
            });
        });
    </script>
</body></html>
