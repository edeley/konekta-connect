<script>
        function toggleFilter(btn) {
            // Reset all buttons
            const buttons = btn.parentElement.querySelectorAll('button');
            buttons.forEach(b => {
                b.classList.remove('active-filter');
                b.classList.add('bg-white/90', 'text-grey600');
            });
            
            // Set active button
            btn.classList.add('active-filter');
            btn.classList.remove('bg-white/90', 'text-grey600');
        }

        function scrollToCard(index) {
            const carousel = document.getElementById('providerCarousel');
            const items = carousel.querySelectorAll('.carousel-item');
            if (items[index]) {
                items[index].scrollIntoView({ behavior: 'smooth', inline: 'center' });
            }
        }

        // Add some micro-interaction for the map drag feel
        let isDragging = false;
        let startX, scrollLeft;

        const carousel = document.getElementById('providerCarousel');
        carousel.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.pageX - carousel.offsetLeft;
            scrollLeft = carousel.scrollLeft;
        });
        carousel.addEventListener('mouseleave', () => isDragging = false);
        carousel.addEventListener('mouseup', () => isDragging = false);
        carousel.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - carousel.offsetLeft;
            const walk = (x - startX) * 2;
            carousel.scrollLeft = scrollLeft - walk;
        });
    </script>
