<span class="material-symbols-outlined">backspace</span>

<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-surface shadow-[0_-4px_12px_0_rgba(0,96,54,0.08)] rounded-t-xl z-50">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-label-lg flex items-center justify-center gap-2 active:scale-95 transition-transform duration-200">
            Continuar para Confirmar
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Floating Navigation Bar (Logic: Wallet is Active) -->
<!-- Note: Following guidelines, suppressed if the focus is a specific task (Transaction). 
         However, keeping it subtly for context if user needs to navigate back to Wallet.
         Actually, the rules say: "Suppress if the page intent is linear/transactional".
         I will skip the BottomNavBar to prioritize the "Focused Journey".
    -->
<script>
        const amountDisplay = document.getElementById('amount-input');
        let currentAmount = "0";

        function updateDisplay() {
            amountDisplay.value = currentAmount;
        }

        function addDigit(digit) {
            if (currentAmount === "0" && digit !== ",") {
                currentAmount = digit;
            } else {
                if (digit === "," && currentAmount.includes(",")) return;
                // Limit decimals and length
                if (currentAmount.length > 10) return;
                currentAmount += digit;
            }
            updateDisplay();
        }

        function deleteDigit() {
            if (currentAmount.length > 1) {
                currentAmount = currentAmount.slice(0, -1);
            } else {
                currentAmount = "0";
            }
            updateDisplay();
        }

        // Add subtle haptic-like feedback visual
        document.querySelectorAll('.numpad-button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.classList.add('bg-primary-container/20');
            });
            btn.addEventListener('touchend', function() {
                this.classList.remove('bg-primary-container/20');
            });
        });
    </script>
