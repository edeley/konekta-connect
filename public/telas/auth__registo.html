<style>

<body class="bg-surface text-on-surface overflow-x-hidden">
<!-- Header (Shared TopAppBar Reference) -->
<header class="fixed top-0 left-0 w-full z-50 bg-primary shadow-sm h-16 flex items-center px-screen-margin pt-safe transition-all active:scale-95">
<button class="mr-4 text-on-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-primary">KONEKTA STP</h1>
</header>
<main class="pt-24 pb-12 min-h-screen">
<form class="flex flex-col" id="registrationForm">
<!-- Progress Indicator -->
<div class="px-screen-margin mb-lg">
<div class="flex items-center justify-between mb-sm">
<span class="font-headline-sm text-headline-sm text-primary" id="stepTitle">Os teus dados</span>
<span class="font-label text-label text-grey600" id="stepCounter">Passo 1 de 2</span>
</div>
<div class="w-full h-1.5 bg-grey200 rounded-full overflow-hidden">
<div class="h-full bg-primary transition-all duration-500 w-1/2" id="progressBar"></div>
</div>
</div>
<!-- Scrollable Content Container -->
<div class="flex overflow-x-hidden snap-x-mandatory custom-scrollbar scroll-smooth" id="scrollContainer">
<!-- STEP 1: Os teus dados -->
<section class="flex-none w-full px-screen-margin snap-center space-y-md" id="step1">
<!-- Full Name -->
<div class="space-y-xs">
<label class="font-label text-label text-grey600 ml-1">Nome completo</label>
<div class="flex items-center bg-grey100 border border-grey200 rounded-xl px-4 py-3 focus-within:border-primary transition-colors">
<span class="material-symbols-outlined text-grey400 mr-3">person</span>
<input class="bg-transparent w-full font-body-sm text-body-sm text-on-surface focus:outline-none" placeholder="Ex: João Manuel" required="" type="text"/>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-xs">
<label class="font-label text-label text-grey600 ml-1">Telemóvel</label>
<div class="flex items-center bg-grey100 border border-grey200 rounded-xl px-4 py-3 focus-within:border-primary transition-colors">
<span class="font-body-sm text-body-sm text-grey600 mr-2 border-r border-grey200 pr-2">+239</span>
<input class="bg-transparent w-full font-body-sm text-body-sm text-on-surface focus:outline-none" placeholder="9xx xxx" required="" type="tel"/>
</div>
</div>
<!-- Password Group -->
<div class="space-y-md pt-2">
<div class="space-y-xs">
<label class="font-label text-label text-grey600 ml-1">Palavra-passe</label>
<div class="flex items-center bg-grey100 border border-grey200 rounded-xl px-4 py-3 focus-within:border-primary transition-colors">
<span class="material-symbols-outlined text-grey400 mr-3">lock</span>
<input class="bg-transparent w-full font-body-sm text-body-sm text-on-surface focus:outline-none" id="passwordInput" placeholder="••••••••" required="" type="password"/>
<button class="text-grey400" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Strength Bar -->
<div class="px-1 pt-1">
<div class="flex justify-between items-center mb-1">
<span class="font-caption text-caption text-grey600">Segurança</span>
<span class="font-caption text-caption font-medium text-error" id="strengthText">Fraca</span>
</div>
<div class="flex gap-1">
<div class="h-1 flex-1 rounded-full bg-grey200" id="bar1"></div>
<div class="h-1 flex-1 rounded-full bg-grey200" id="bar2"></div>
<div class="h-1 flex-1 rounded-full bg-grey200" id="bar3"></div>
<div class="h-1 flex-1 rounded-full bg-grey200" id="bar4"></div>
</div>
</div>
</div>
<div class="space-y-xs">
<label class="font-label text-label text-grey600 ml-1">Confirmar palavra-passe</label>
<div class="flex items-center bg-grey100 border border-grey200 rounded-xl px-4 py-3 focus-within:border-primary transition-colors">
<span class="material-symbols-outlined text-grey400 mr-3">lock_reset</span>
<input class="bg-transparent w-full font-body-sm text-body-sm text-on-surface focus:outline-none" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<div class="pt-lg">
<button class="w-full bg-primary text-on-primary font-button text-button h-14 rounded-full shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2" onclick="nextStep()" type="button">
                            Próximo
                            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</section>
<!-- STEP 2: Como vais usar? -->
<section class="flex-none w-full px-screen-margin snap-center space-y-lg opacity-0 pointer-events-none transition-opacity duration-300" id="step2">
<div class="space-y-md">
<p class="font-body-sm text-body-sm text-grey600">Escolhe o teu perfil principal na Konekta.</p>
<!-- Profile Cards -->
<div class="grid grid-cols-1 gap-md">
<label class="relative block group">
<input checked="" class="peer hidden" name="profile" type="radio" value="cliente"/>
<div class="flex items-center p-4 bg-white border border-grey200 rounded-xl shadow-sm cursor-pointer peer-checked:border-primary peer-checked:bg-primary-fixed-dim/10 transition-all">
<div class="w-12 h-12 rounded-lg bg-primary/10 flex items-center justify-center mr-4">
<span class="material-symbols-outlined text-primary">person_search</span>
</div>
<div class="flex-1">
<h4 class="font-title-sm text-title-sm text-on-surface">Cliente</h4>
<p class="font-caption text-caption text-grey600">Quero contratar serviços</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-grey200 peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
</div>
</div>
</label>
<label class="relative block group">
<input class="peer hidden" name="profile" type="radio" value="prestador"/>
<div class="flex items-center p-4 bg-white border border-grey200 rounded-xl shadow-sm cursor-pointer peer-checked:border-primary peer-checked:bg-primary-fixed-dim/10 transition-all">
<div class="w-12 h-12 rounded-lg bg-secondary/10 flex items-center justify-center mr-4">
<span class="material-symbols-outlined text-secondary">handyman</span>
</div>
<div class="flex-1">
<h4 class="font-title-sm text-title-sm text-on-surface">Prestador</h4>
<p class="font-caption text-caption text-grey600">Quero oferecer os meus serviços</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-grey200 flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-white opacity-0"></div>
</div>
</div>
</label>
<label class="relative block group">
<input class="peer hidden" name="profile" type="radio" value="ambos"/>
<div class="flex items-center p-4 bg-white border border-grey200 rounded-xl shadow-sm cursor-pointer peer-checked:border-primary peer-checked:bg-primary-fixed-dim/10 transition-all">
<div class="w-12 h-12 rounded-lg bg-tertiary-container/20 flex items-center justify-center mr-4">
<span class="material-symbols-outlined text-tertiary">group_add</span>
</div>
<div class="flex-1">
<h4 class="font-title-sm text-title-sm text-on-surface">Ambos</h4>
<p class="font-caption text-caption text-grey600">Gerir pedidos e prestar serviços</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-grey200 flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-white opacity-0"></div>
</div>
</div>
</label>
</div>
</div>
<!-- Zone Selector -->
<div class="space-y-xs">
<label class="font-label text-label text-grey600 ml-1">Distrito de residência</label>
<div class="relative">
<select class="w-full bg-grey100 border border-grey200 rounded-xl px-4 py-3 font-body-sm text-body-sm text-on-surface appearance-none focus:border-primary focus:outline-none">
<option disabled="" selected="" value="">Selecionar Distrito</option>
<option value="agua-grande">Água Grande</option>
<option value="me-zochi">Mé-Zóchi</option>
<option value="cantagalo">Cantagalo</option>
<option value="caue">Caué</option>
<option value="lemba">Lembá</option>
<option value="lobata">Lobata</option>
<option value="pague">Pagué (Príncipe)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-grey400 pointer-events-none">expand_more</span>
</div>
</div>
<!-- Terms -->
<label class="flex items-start gap-3 px-1 py-2 cursor-pointer group">
<div class="mt-0.5">
<input class="w-5 h-5 rounded border-grey400 text-primary focus:ring-primary transition-all" required="" type="checkbox"/>
</div>
<span class="font-caption text-caption text-grey600 leading-tight">
                            Li e aceito os <a class="text-primary font-medium underline decoration-primary/30" href="#">Termos e Condições</a> e a <a class="text-primary font-medium underline decoration-primary/30" href="#">Política de Privacidade</a> da KONEKTA.
                        </span>
</label>
<div class="flex flex-col gap-sm pt-4">
<button class="w-full bg-primary text-on-primary font-button text-button h-14 rounded-full shadow-md active:scale-95 transition-all" type="submit">
                            Criar conta
                        </button>
<button class="w-full bg-transparent text-grey600 font-button text-button h-12 rounded-full border border-grey200 active:bg-grey100 transition-all" onclick="prevStep()" type="button">
                            Voltar
                        </button>
</div>
</section>
</div>
</form>
</main>
<!-- Footer Support (Shared BottomNavBar Reference) -->
<footer class="fixed bottom-0 w-full z-50 bg-surface shadow-md flex justify-around items-center px-4 py-2 pb-safe rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant p-2 rounded-xl transition-all">
<span class="material-symbols-outlined">help_outline</span>
<span class="font-label text-label">Help</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant p-2 rounded-xl transition-all">
<span class="material-symbols-outlined">support_agent</span>
<span class="font-label text-label">Support</span>
</button>
</footer>
<script>
        const scrollContainer = document.getElementById('scrollContainer');
        const progressBar = document.getElementById('progressBar');
        const stepCounter = document.getElementById('stepCounter');
        const stepTitle = document.getElementById('stepTitle');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');

        function nextStep() {
            scrollContainer.scrollTo({
                left: window.innerWidth,
                behavior: 'smooth'
            });
            updateProgress(2);
        }

        function prevStep() {
            scrollContainer.scrollTo({
                left: 0,
                behavior: 'smooth'
            });
            updateProgress(1);
        }

        function updateProgress(step) {
            if (step === 2) {
                progressBar.style.width = '100%';
                stepCounter.innerText = 'Passo 2 de 2';
                stepTitle.innerText = 'Perfil de Uso';
                step2.classList.remove('opacity-0', 'pointer-events-none');
                step1.classList.add('opacity-0', 'pointer-events-none');
            } else {
                progressBar.style.width = '50%';
                stepCounter.innerText = 'Passo 1 de 2';
                stepTitle.innerText = 'Os teus dados';
                step1.classList.remove('opacity-0', 'pointer-events-none');
                step2.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // Password Strength Logic
        const passwordInput = document.getElementById('passwordInput');
        const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
        const strengthText = document.getElementById('strengthText');

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let strength = 0;
            if (val.length > 5) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            bars.forEach((bar, index) => {
                bar.className = 'h-1 flex-1 rounded-full bg-grey200 transition-colors duration-300';
                if (index < strength) {
                    if (strength === 1) { bar.classList.replace('bg-grey200', 'bg-error'); strengthText.innerText = 'Fraca'; strengthText.className = 'font-caption text-caption font-medium text-error'; }
                    else if (strength === 2) { bar.classList.replace('bg-grey200', 'bg-warning'); strengthText.innerText = 'Média'; strengthText.className = 'font-caption text-caption font-medium text-warning'; }
                    else if (strength >= 3) { bar.classList.replace('bg-grey200', 'bg-primary'); strengthText.innerText = 'Forte'; strengthText.className = 'font-caption text-caption font-medium text-primary'; }
                }
            });
            if (val === '') {
                strengthText.innerText = 'Fraca';
                strengthText.className = 'font-caption text-caption font-medium text-error';
            }
        });

        // Radio Selection UI helper
        document.querySelectorAll('input[name="profile"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('input[name="profile"]').forEach(r => {
                   r.nextElementSibling.querySelector('div:last-child > div').classList.add('opacity-0');
                   r.nextElementSibling.classList.replace('border-primary', 'border-grey200');
                   r.nextElementSibling.classList.replace('bg-primary-fixed-dim/10', 'bg-white');
                });
                if (e.target.checked) {
                   e.target.nextElementSibling.querySelector('div:last-child > div').classList.remove('opacity-0');
                }
            });
        });

        // Handle Form Submission
        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulating success
            alert('Conta criada com sucesso na KONEKTA STP!');
        });
    </script>
</body></html>
