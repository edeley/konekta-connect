<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">

</div>

<main class="flex-1 w-full max-w-2xl mx-auto px-4 py-6 pb-32">
<!-- Search Bar Section -->
<section class="mb-8">

<input class="w-full h-14 pl-12 pr-4 rounded-xl border-none bg-surface-container-low text-body-md focus:ring-2 focus:ring-primary transition-all shadow-sm placeholder:text-outline-variant" placeholder="Descreva o problema ou pesquise..." type="text"/>

</section>
<!-- Dynamic Context Suggestions (Asymmetric Grid) -->
<section class="mb-10">
<h2 class="font-headline-md text-headline-md mb-4 px-1">Sugestões Comuns</h2>
<div class="grid grid-cols-2 gap-3">
<!-- Large Highlight Card -->

<div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent flex flex-col justify-end p-4">
<span class="text-white font-label-md">Torneira a pingar</span>
<span class="text-white/80 text-label-sm">Reparação rápida de canalização</span>
</div>
</button>
<!-- Category-style Cards -->
<button class="flex flex-col items-start p-4 rounded-2xl bg-category-bg-low-opacity transition-all hover:bg-primary/10 active:scale-95 text-left border border-primary/5">
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center mb-3 text-on-primary">
<span class="material-symbols-outlined">water_damage</span>
</div>
<span class="font-label-md text-primary">Fuga no cano</span>
<span class="text-label-sm text-outline">Detecção de rotura</span>
</button>
<button class="flex flex-col items-start p-4 rounded-2xl bg-category-bg-low-opacity transition-all hover:bg-primary/10 active:scale-95 text-left border border-primary/5">

</div>

<div class="flex items-center justify-between mt-4 border-t border-outline-variant/20 pt-4">

</button>
</div>

<span class="material-symbols-outlined fill-icon" style="font-variation-settings: 'FILL' 1;">help_outline</span>
<span class="font-label text-label">Help</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-transform active:scale-90 hover:bg-surface-variant p-2 rounded-xl" href="#">
<span class="material-symbols-outlined">support_agent</span>
<span class="font-label text-label">Support</span>
</a>
</nav>
<script>
        // Micro-interactions
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const pulse = document.getElementById('recordingPulse');
        let isRecording = false;

        micBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                micIcon.innerText = 'stop';
                micIcon.classList.add('text-error');
                pulse.classList.remove('hidden');
                micBtn.classList.add('ring-2', 'ring-error');
            } else {
                micIcon.innerText = 'mic';
                micIcon.classList.remove('text-error');
                pulse.classList.add('hidden');
                micBtn.classList.remove('ring-2', 'ring-error');
            }
        });

        // Floating shadow effect for header on scroll
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('shadow-md');
            } else {
                header.classList.remove('shadow-md');
            }
        });
    </script>
