            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

            outline: none;

        }

<body class="min-h-screen flex flex-col items-center">
<!-- Header Section (TopAppBar Identity) -->
<header class="w-full top-0 sticky z-50 bg-surface shadow-sm h-16 flex items-center justify-center px-screen-margin">
<div class="flex items-center justify-between w-full max-w-lg">
<button class="p-2 -ml-2 text-on-surface-variant hover:bg-grey100 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-primary">KONEKTA STP</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<main class="w-full max-w-lg px-screen-margin py-lg flex-1">
<!-- Brand Message -->
<section class="mb-xl">
<h2 class="font-headline-lg text-headline-lg text-grey900 mb-xs">Criar Conta</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Registe-se para aceder aos melhores serviços em São Tomé e Príncipe.</p>
</section>
<!-- Registration Form -->
<form class="space-y-lg pb-xl">
<!-- Profile Photo Upload -->
<div class="flex flex-col items-center justify-center space-y-md">
<div class="relative group">
<div class="w-24 h-24 rounded-full bg-grey100 flex items-center justify-center overflow-hidden border-2 border-dashed border-grey200 group-hover:border-primary transition-colors cursor-pointer" id="avatar-container">
<span class="material-symbols-outlined text-grey400 text-4xl" id="avatar-placeholder">add_a_photo</span>
<img class="hidden object-cover w-full h-full" data-alt="A professional, high-fidelity portrait placeholder showing a clean, minimalist silhouette against a soft tropical green and white abstract background. The lighting is bright and airy, reflecting a modern corporate minimalism style with a warm, welcoming atmosphere consistent with Sao Tome and Principe branding." id="preview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBNrUvh2YXu1SEkutFDjFEFq8c6oeHEaBi4nAA-22pbP5mFjPDoHo4xCxaj9zCJUKryqZMfYFOG_ANNFZl27nKG6SQgIHJV_ArJeF1x6h-VB_TUVngxVMTZdn151wFQSZI7a_HT7Voh2NIh4nIQ0pOalCWzPnliDCl1ucWnq5o69J4Lq1YEVW-wQRPazGFgFTIIvcZNrR1jO-ejmNLHt3wHgIa2Romph40MqZLTSbI6oOX0Hib0azOA-TNfJJgYpZlXq0dLQ9G0ivI"/>
</div>
<input accept="image/*" class="hidden" id="photo-upload" type="file"/>
<button class="absolute bottom-0 right-0 bg-primary text-white p-1.5 rounded-full shadow-md active:scale-95 transition-transform" onclick="document.getElementById('photo-upload').click()" type="button">
<span class="material-symbols-outlined text-[18px]">edit</span>
</button>
</div>
<span class="font-label text-label text-grey600">Foto de perfil (opcional)</span>
</div>
<!-- Full Name -->
<div class="space-y-xs">
<label class="font-label text-label text-grey600 px-1">Nome Completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-grey400 text-[20px]">person</span>
<input class="w-full h-14 pl-12 pr-4 bg-grey50 border border-grey200 rounded-xl font-body-lg transition-all focus:bg-white" placeholder="Ex: João da Silva" required="" type="text"/>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-xs">
<label class="font-label text-label text-grey600 px-1">Número de Telefone</label>
<div class="flex gap-2">
<div class="w-24 h-14 bg-grey100 border border-grey200 rounded-xl flex items-center justify-center gap-1 shrink-0">
<span class="text-xs font-bold text-grey600">+239</span>
<div class="w-4 h-3 bg-red-600 relative overflow-hidden rounded-[1px]">
<div class="absolute top-0 h-1/3 w-full bg-red-600"></div>
<div class="absolute top-1/3 h-1/3 w-full bg-yellow-400"></div>
<div class="absolute bottom-0 h-1/3 w-full bg-green-600"></div>
<div class="absolute left-0 top-0 h-full w-1/3 bg-white" style="clip-path: polygon(0 0, 100% 50%, 0 100%);"></div>
</div>
</div>
<input class="flex-1 h-14 px-4 bg-grey50 border border-grey200 rounded-xl font-body-lg transition-all focus:bg-white" placeholder="9xx xxx" required="" type="tel"/>
</div>
</div>
<!-- District Selection & Gender (Row) -->
<div class="grid grid-cols-2 gap-lg">
<div class="space-y-xs">
<label class="font-label text-label text-grey600 px-1">Distrito</label>
<select class="w-full h-14 px-4 bg-grey50 border border-grey200 rounded-xl font-body-lg appearance-none transition-all focus:bg-white">
<option disabled="" selected="" value="">Selecionar</option>
<option value="agua-grande">Água Grande</option>
<option value="me-zochi">Mé-Zóchi</option>
<option value="cantagalo">Cantagalo</option>
<option value="caué">Caué</option>
<option value="lemba">Lembá</option>
<option value="lobata">Lobata</option>
<option value="pagué">Pagué</option>
</select>
</div>
<div class="space-y-xs">
<label class="font-label text-label text-grey600 px-1">Género</label>
<select class="w-full h-14 px-4 bg-grey50 border border-grey200 rounded-xl font-body-lg appearance-none transition-all focus:bg-white">
<option disabled="" selected="" value="">Selecionar</option>
<option value="male">Masculino</option>
<option value="female">Feminino</option>
<option value="other">Outro</option>
</select>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="font-label text-label text-grey600 px-1">Palavra-passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-grey400 text-[20px]">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-grey50 border border-grey200 rounded-xl font-body-lg transition-all focus:bg-white" id="password-field" placeholder="No mínimo 8 caracteres" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-grey400 hover:text-primary transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Action -->
<div class="pt-md">
<button class="w-full h-14 bg-primary text-white font-button text-button rounded-full shadow-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
<span>Começar agora</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Terms -->
<p class="text-center font-caption text-caption text-grey600 px-4">
                Ao clicar em "Começar agora", concorda com os nossos 
                <a class="text-primary font-medium hover:underline" href="#">Termos de Serviço</a> e 
                <a class="text-primary font-medium hover:underline" href="#">Política de Privacidade</a>.
            </p>
<!-- Login Redirect -->
<div class="text-center pt-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Já tem uma conta? 
                    <a class="text-primary font-semibold hover:underline ml-1" href="#">Entrar</a>
</p>
</div>
</form>
</main>
<!-- Visual Accent (Tropical Minimalist) -->
<div class="fixed -bottom-20 -left-20 w-64 h-64 bg-secondary-container/10 rounded-full blur-3xl -z-10"></div>
<div class="fixed -top-20 -right-20 w-80 h-80 bg-primary-fixed-dim/5 rounded-full blur-3xl -z-10"></div>
<script>
        // Password Visibility Toggle
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password-field');
        
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleBtn.querySelector('span').textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Photo Upload Preview
        const photoUpload = document.getElementById('photo-upload');
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('avatar-placeholder');

        photoUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Micro-interactions for form submission
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span> Processando...`;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Conta Criada!`;
                btn.classList.replace('bg-primary', 'bg-secondary');
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-secondary', 'bg-primary');
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
