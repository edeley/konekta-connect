<body class="font-body-md text-on-surface">
<!-- TopAppBar -->

<div class="flex items-center gap-4">
<button class="hover:bg-surface-container-low transition-colors p-2 rounded-full active:scale-95 duration-150 text-primary" onclick="window.history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Editar Perfil</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-fixed-dim">
<img class="w-full h-full object-cover" data-alt="A professional close-up portrait of a friendly Santomean man in high-quality photography style. He is wearing a clean white linen shirt against a soft-focus tropical garden background. The lighting is warm and natural, evoking a sense of trust and community. The color palette is dominated by soft whites and vibrant greens, matching a clean, professional corporate modern UI aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAASpSEyEPsDt6V6_1bbP0sQhd6PNT1XDMRXpRcKtS3bulH6g55d7jey6-AeHQHG6EYj1wBvSLofTtGElbIMarwhBp0vEiRhXg-7pY513UcnJsGaE3X_Hw_3-XsXjaH5IVUrgXz4Hg5aPbWXS09X0kwqRWDNZBF7Auo7zqiHwwo6l2yWjWWowDSmqMT7JCaG71Wjx0KgRdyMULKVHSd3iRD_glV0NiXqkPDNN364kIgQ2aNQ6D6ZtN-maaJgdry0vsROr0iIEt7CPk"/>
</div>
</header>
<main class="max-w-md mx-auto px-container-margin py-lg pb-32">
<!-- Profile Picture Section -->
<section class="flex flex-col items-center mb-xl">
<div class="relative group">
<div class="w-32 h-32 rounded-full border-4 border-surface-container shadow-lg overflow-hidden relative">
<img class="w-full h-full object-cover" data-alt="A detailed headshot of a professional service user, showing a clear, welcoming face. The shot is captured with a high-end mirrorless camera, featuring shallow depth of field. The background is a minimalist, brightly lit modern interior in São Tomé, emphasizing light-mode aesthetics and warm tropical sunlight. The primary color focus is on natural skin tones and the soft green of a potted plant nearby." id="profile-preview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCpTQge5dsbPVsFkIvg6Nskeb1tSq0QFCVIOp84GL5TcPkMQ5s58viNF6boM0s6Hefnde1wLSv8aonYAPOU7F--VLyxcWQCtVtfcT70wbkvDOPT8i_K9O8_C5dfN-FtyYJzR82RlQ2vJ2oonUKY1nlA-AwMGwcHpDZHXad9ebctSLa9Sow6gdxYnawusq8dlTx0nvWYcTZkX7S6JiyeWJA0THOH-DKcnr8XG3fbzmrh5ZBKmp8ym_jxBSRwpG8z9sqOxpHm2aQ6KfI"/>
<div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-white text-3xl">photo_camera</span>
</div>
</div>
<button class="absolute bottom-1 right-1 bg-primary text-on-primary p-2 rounded-full shadow-md active:scale-95 transition-transform">
<span class="material-symbols-outlined text-sm">edit</span>
</button>
</div>
<p class="mt-4 font-label-lg text-primary">Alterar Foto de Perfil</p>
</section>
<!-- Form Fields -->
<form class="space-y-lg">
<!-- Name Input -->
<div class="space-y-xs">
<label class="block font-label-lg text-on-surface-variant ml-1">Nome Completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full h-[56px] pl-12 pr-4 rounded-xl border-outline-variant bg-white focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md shadow-sm" placeholder="O seu nome" type="text" value="João Silva"/>
</div>
</div>
<!-- Phone Input -->
<div class="space-y-xs">
<label class="block font-label-lg text-on-surface-variant ml-1">Número de Telefone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">call</span>
<input class="w-full h-[56px] pl-12 pr-4 rounded-xl border-outline-variant bg-white focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md shadow-sm" placeholder="+239 --- ---" type="tel" value="+239 990 1234"/>
</div>
</div>
<!-- Email (Disabled) -->
<div class="space-y-xs opacity-70">
<label class="block font-label-lg text-on-surface-variant ml-1">Email (Não editável)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-[56px] pl-12 pr-4 rounded-xl border-outline-variant bg-surface-container-low font-body-md cursor-not-allowed" disabled="" type="email" value="joao.silva@konekta.st"/>
</div>
</div>
<!-- Default Address -->
<div class="space-y-xs">
<label class="block font-label-lg text-on-surface-variant ml-1">Morada Padrão</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">location_on</span>
<textarea class="w-full pl-12 pr-4 py-4 rounded-xl border-outline-variant bg-white focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md shadow-sm resize-none" placeholder="Ex: Água Grande, São Tomé" rows="3">Rua da Independência, Bloco B, 2º Andar, São Tomé</textarea>
</div>
</div>
<!-- Location Picker Mock -->
<div class="p-4 rounded-xl border-2 border-dashed border-outline-variant flex items-center justify-center gap-3 text-on-surface-variant hover:border-primary hover:text-primary cursor-pointer transition-all bg-white/50">
<span class="material-symbols-outlined">map</span>
<span class="font-label-lg">Atualizar no mapa</span>
</div>
</form>
<!-- Save Button Container -->
<div class="fixed bottom-24 left-0 w-full px-container-margin">
<button class="w-full max-w-md mx-auto h-[56px] bg-primary text-on-primary rounded-full font-headline-md flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-95 transition-transform">
<span class="material-symbols-outlined">save</span>
                Guardar Alterações
            </button>
</div>
</main>
<!-- BottomNavBar (Hidden on desktop in real app, simplified here) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-2 pb-safe bg-surface shadow-[0_-4px_12px_rgba(0,96,54,0.08)] rounded-t-xl z-50">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">list_alt</span>
<span class="font-label-sm text-label-sm">Pedidos</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-sm text-label-sm">Pagamentos</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined active-icon" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm font-bold">Perfil</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input, textarea').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#006036';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#6f7a70';
            });
        });

        // Simple button active state visual feedback
        const saveBtn = document.querySelector('button.bg-primary');
        saveBtn.addEventListener('click', (e) => {
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> A guardar...`;
            saveBtn.classList.add('opacity-80');
            setTimeout(() => {
                saveBtn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Guardado!`;
                saveBtn.classList.remove('bg-primary');
                saveBtn.classList.add('bg-primary-container', 'text-on-primary-container');
                setTimeout(() => {
                    saveBtn.innerHTML = originalText;
                    saveBtn.classList.remove('bg-primary-container', 'text-on-primary-container', 'opacity-80');
                    saveBtn.classList.add('bg-primary');
                }, 2000);
            }, 1200);
        });
    </script>
</body></html>
