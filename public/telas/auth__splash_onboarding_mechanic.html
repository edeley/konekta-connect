<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .image-mask {
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-lg">
<!-- Top AppBar (Simulated as Splash Header) -->
<header class="w-full top-0 sticky z-50 bg-surface flex items-center justify-between px-screen-margin h-16 max-w-7xl mx-auto shadow-sm">
<div class="font-headline-md text-headline-md font-bold tracking-tight text-primary">
            KONEKTA STP
        </div>
<button class="text-on-surface-variant font-label text-label hover:bg-grey100 p-2 rounded-lg transition-colors">
            Saltar
        </button>
</header>
<main class="flex-grow flex flex-col items-center justify-center">
<!-- Main Content Area -->
<div class="w-full max-w-md mx-auto flex flex-col px-screen-margin pt-lg pb-xxl space-y-lg">
<!-- Hero Image Container with Organic Feel -->
<div class="relative w-full aspect-square rounded-[2rem] overflow-hidden shadow-md fade-in" style="animation-delay: 0.1s;">
<div class="absolute inset-0 bg-primary-container/10 z-10"></div>
<img alt="Mechanic and client handshake" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDj88ev7h25UNdTCNGQX18QVWLa-kNESN7mX1ajvJW97iEMXEFH280yeA3B0LnorBMbmlj2pR5sPCQXOH9z4cSBdIYCKT8p94Q68Spywr1Hb5NkP8mHp5UKU4foyYMAn_8Cn46_t8bVEASFiMt6IqvAoKr5eUNJ26YcoS367k5uPkgEZ-EDxGnoXOsULlu3G8njdgC2rzGMn2R5ERWiig-elrzDduBK07bHn21NurVH22Cgp3b_XXgDQCFItizkzPvGG6yRL4a46mo"/>
<!-- Decorative Badge -->
<div class="absolute bottom-4 left-4 bg-surface/90 backdrop-blur-md px-4 py-2 rounded-full flex items-center gap-2 shadow-sm z-20">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label text-label text-on-surface">Serviço Confiável</span>
</div>
</div>
<!-- Typography Content -->
<div class="space-y-sm text-center fade-in" style="animation-delay: 0.3s;">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-grey900">
                    A tua rede local
                </h1>
<p class="font-body-lg text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                    Conectando talentos e oportunidades nas ilhas de São Tomé e Príncipe.
                </p>
</div>
<!-- Interaction Section -->
<div class="pt-md flex flex-col items-center space-y-md fade-in" style="animation-delay: 0.5s;">
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-button text-button py-4 rounded-full shadow-sm active:scale-95 transition-transform duration-200">
                    Próximo
                </button>
<!-- Pagination Dots -->
<div class="flex gap-2">
<div class="h-2 w-6 bg-primary rounded-full"></div>
<div class="h-2 w-2 bg-grey200 rounded-full"></div>
<div class="h-2 w-2 bg-grey200 rounded-full"></div>
</div>
</div>
</div>
</main>
<!-- Footer Identity -->
<footer class="pb-screen-margin flex flex-col items-center space-y-sm fade-in" style="animation-delay: 0.7s;">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-secondary text-lg">public</span>
<span class="font-caption text-caption text-grey400 tracking-widest uppercase">STP CONNECTED</span>
</div>
<!-- Safety/Trust Indicators -->
<p class="font-caption text-caption text-grey400">
            © 2024 KONEKTA. Todos os direitos reservados.
        </p>
</footer>
<!-- Interactive Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextBtn = document.querySelector('button.bg-primary');
            const skipBtn = document.querySelector('header button');

            nextBtn.addEventListener('click', () => {
                // Subtle tactile feedback simulated by CSS active:scale-95
                console.log('Navegando para o próximo slide...');
            });

            skipBtn.addEventListener('click', () => {
                console.log('Ignorando introdução...');
            });

            // Gentle parallax effect on image container
            window.addEventListener('mousemove', (e) => {
                const imgContainer = document.querySelector('.relative.w-full.aspect-square');
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                imgContainer.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        });
    </script>
