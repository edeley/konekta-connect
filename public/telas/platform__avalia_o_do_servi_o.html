<script>
        // Star Rating Interaction Logic
        const stars = document.querySelectorAll('#ratingContainer .material-symbols-outlined');
        const ratingLabel = document.getElementById('ratingLabel');
        const labels = {
            1: 'Terrible',
            2: 'Poor',
            3: 'Good',
            4: 'Very Good',
            5: 'Outstanding'
        };

        stars.forEach(star => {
            star.addEventListener('click', () => {
                const value = parseInt(star.getAttribute('data-value'));
                updateRating(value);
            });

            star.addEventListener('mouseenter', () => {
                const value = parseInt(star.getAttribute('data-value'));
                highlightStars(value);
            });

            star.addEventListener('mouseleave', () => {
                const currentRating = document.querySelector('#ratingContainer').dataset.rating || 0;
                highlightStars(parseInt(currentRating));
            });
        });

        function updateRating(value) {
            document.querySelector('#ratingContainer').dataset.rating = value;
            ratingLabel.textContent = labels[value];
            highlightStars(value);
            
            // Micro-interaction: scale effect on click
            const selectedStar = stars[value - 1];
            selectedStar.classList.add('scale-150');
            setTimeout(() => selectedStar.classList.remove('scale-150'), 200);
        }

        function highlightStars(value) {
            stars.forEach((s, index) => {
                if (index < value) {
                    s.classList.add('active');
                    s.classList.replace('text-outline-variant', 'text-secondary-fixed-dim');
                } else {
                    s.classList.remove('active');
                    s.classList.replace('text-secondary-fixed-dim', 'text-outline-variant');
                }
            });
        }
    </script>
