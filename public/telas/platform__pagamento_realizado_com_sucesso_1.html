<!DOCTYPE html>

<html lang="pt"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes scale-check {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes float-particle {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .animate-check {
            animation: scale-check 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .celebration-particle {
            position: absolute;
            pointer-events: none;
            animation: float-particle 1.5s ease-out forwards;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#abffc6",
                        "on-background": "#121c2c",
                        "on-surface-variant": "#3f4941",
                        "primary-fixed": "#9bf6ba",
                        "on-surface": "#121c2c",
                        "background": "#f9f9ff",
                        "primary": "#006036",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f9f9ff",
                        "primary-container": "#1a7a4a",
                        "outline": "#6f7a70",
                        "surface-variant": "#d9e3f9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "container-margin": "20px",
                        "lg": "24px",
                        "xl": "32px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-lg": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md overflow-x-hidden min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Success State: Suppressed Bottom Nav, Minimal Top) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-margin h-16 bg-surface shadow-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">KONEKTA STP</h1>
<button class="material-symbols-outlined text-on-surface-variant p-2 hover:bg-primary-container/10 transition-colors rounded-full">close</button>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-margin pt-24 pb-12 overflow-y-auto">
<!-- Success Animation & Main Card -->
<div class="relative w-full max-w-md flex flex-col items-center" id="celebration-container">
<!-- Success Icon -->
<div class="mb-8 relative">
<div class="animate-check bg-primary text-on-primary w-24 h-24 rounded-full flex items-center justify-center shadow-[0_8px_24px_rgba(0,96,54,0.2)]">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'wght' 600;">check</span>
</div>
</div>
<!-- Transaction Feedback -->
<div class="text-center mb-8 space-y-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Pagamento Concluído!</h2>
<p class="text-on-surface-variant font-body-md">O serviço foi finalizado com sucesso.</p>
</div>
<!-- Details Bento Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-6 shadow-sm space-y-6 border border-surface-variant/30">
<!-- Amount Paid -->
<div class="flex flex-col items-center py-2">
<span class="text-label-lg text-on-surface-variant uppercase tracking-wider">Valor Pago</span>
<span class="font-headline-lg text-primary">500 STN</span>
</div>
<div class="h-px bg-surface-variant/50 w-full"></div>
<!-- Provider Info -->
<div class="flex items-center gap-4">
<div class="w-14 h-14 rounded-full overflow-hidden border-2 border-primary-fixed">
<img class="w-full h-full object-cover" data-alt="A professional Santomean woman in her late 30s, Maria dos Santos, smiling warmly at the camera. She has a neat hairstyle and is wearing a clean, modern service professional uniform in soft earth tones. The background is a brightly lit, modern office with lush green tropical plants, suggesting a professional yet welcoming Santomean business environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAf1ocyyFdl1K9uTy5wZLrrl5ELS0opgZyuu67nkN0XLFnUlajHwprfv8f9EJtE-1LMQtE1YfuEB2gSPFi4zMOvAaUOkx3DTLQkBYK9NMPvm9pNPYbAwJRXsbwNHLX3FBhcAfM1Zvv9Alehe3tcx3Ay4_KxvOO2p0eEARypcDfA3ZUssZzhMIiIT_jyCNJ47Eix2DZm0d5I8lgwD83-ni0eb22xkHHtCaRBkw9XgCjcx8YksNF3YLhYMcOFizwJhFWi01mB5-3A-Ng"/>
</div>
<div class="flex flex-col">
<span class="text-label-sm text-on-surface-variant">Prestador de Serviço</span>
<span class="font-label-lg text-on-surface">Maria dos Santos</span>
</div>
<div class="ml-auto bg-primary-fixed/30 text-primary px-3 py-1 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-label-sm">4.9</span>
</div>
</div>
<!-- Schedule Details -->
<div class="space-y-4">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary">event_available</span>
<div class="flex flex-col">
<span class="text-label-sm text-on-surface-variant">Data e Hora</span>
<span class="text-body-md font-medium text-on-surface">Hoje, 24 de Outubro • 14:30</span>
</div>
</div>
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary">location_on</span>
<div class="flex flex-col">
<span class="text-label-sm text-on-surface-variant">Localização</span>
<span class="text-body-md font-medium text-on-surface">Água Grande, São Tomé</span>
</div>
</div>
</div>
<!-- Receipt ID -->
<div class="pt-4 flex justify-between items-center text-label-sm text-outline border-t border-dashed border-surface-variant">
<span>ID da Transação</span>
<span class="font-mono">#STP-99283-K</span>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full mt-10 space-y-4">
<button class="w-full h-[52px] bg-primary text-on-primary rounded-xl font-label-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20" onclick="createConfetti()">
<span class="material-symbols-outlined">history</span>
                    Acompanhar Pedido
                </button>
<button class="w-full h-[52px] bg-surface-container-lowest border border-primary text-primary rounded-xl font-label-lg hover:bg-primary/5 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">home</span>
                    Voltar ao Início
                </button>
</div>
<!-- Help Support -->
<button class="mt-8 text-on-surface-variant font-label-lg flex items-center gap-2 hover:text-primary transition-colors">
                Precisa de ajuda com este pagamento?
            </button>
</div>
</main>
<script>
        function createConfetti() {
            const container = document.getElementById('celebration-container');
            const colors = ['#006036', '#9bf6ba', '#fabd32', '#7b5900'];
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'celebration-particle';
                
                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `50%`;
                particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                
                const delay = Math.random() * 0.5;
                particle.style.animationDelay = `${delay}s`;
                
                container.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 2000);
            }
        }

        // Trigger on load
        window.addEventListener('load', () => {
            setTimeout(createConfetti, 300);
        });
    </script>
</body></html>
